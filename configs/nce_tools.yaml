# NCE 工具注册表：工具名 + JSON Schema（用于幻觉/参数/取值判定）
tools:
  - name: get_weather
    description: 查询指定城市的当前天气
    parameters:
      type: object
      properties:
        city:
          type: string
          description: 城市名
        unit:
          type: string
          enum: ["c", "f"]
          description: 温度单位，摄氏度 c 或华氏度 f
      required: [city]
      additionalProperties: false

  - name: calculator
    description: 计算数学表达式
    parameters:
      type: object
      properties:
        expression:
          type: string
          pattern: "^[0-9+\\-*/(). ]+$"
          description: 仅允许数字与四则运算符的表达式
      required: [expression]
      additionalProperties: false

  - name: search_knowledge
    description: 在内部知识库中检索知识
    parameters:
      type: object
      properties:
        query:
          type: string
          description: 检索关键词
      required: [query]
      additionalProperties: false

  - name: get_current_time
    description: 获取当前时间
    parameters:
      type: object
      properties:
        timezone:
          type: string
          pattern: "^[A-Za-z_/]+$"
          description: 时区名，如 UTC、Asia/Shanghai
      additionalProperties: false

  # ============ 真实 NCE 工具接入示例（去掉注释即可用） ============
  # 两种执行方式：runtime.type = http（NCE API 接口工具）或 cli（命令行工具）。
  # 未声明 runtime 的工具（如上面 4 个演示工具）回退到 Python 执行器（executor: demo）。

  # —— 示例 1：NCE API 接口工具 ——
  # URL 中 {参数名} 占位；GET/DELETE 的其余参数自动拼 query string，
  # POST/PUT/PATCH 的其余参数作 JSON body；headers 值以 "env:" 开头表示读环境变量。
